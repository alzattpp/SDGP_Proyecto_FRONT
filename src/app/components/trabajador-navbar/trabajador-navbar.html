@if (topLabel()) {
  <p class="pre-bar" aria-hidden="false">{{ topLabel() }}</p>
}
<header class="navbar">
  <a routerLink="/trabajador" class="brand" aria-label="Inicio trabajador SDGP UAM">
    <span class="brand-mark">
      <img src="/assets/logo.png" alt="" width="48" height="48" />
    </span>
    <span class="brand-text">SDGP UAM</span>
  </a>

  <nav class="nav-links" aria-label="Trabajador">
    <a
      routerLink="/trabajador/pagos"
      class="nav-item"
      routerLinkActive="nav-item--active"
      [routerLinkActiveOptions]="{ exact: true }"
      >Pagos</a
    >
    <a
      routerLink="/gestion"
      class="nav-item"
      routerLinkActive="nav-item--active"
      [routerLinkActiveOptions]="{ exact: true }"
      >Gestión</a
    >
    <a
      routerLink="/trabajador/reservas"
      class="nav-item"
      routerLinkActive="nav-item--active"
      [routerLinkActiveOptions]="{ exact: true }"
      >Reservas</a
    >
    <a
      routerLink="/trabajador/perfil"
      class="nav-item"
      routerLinkActive="nav-item--active"
      [routerLinkActiveOptions]="{ exact: true }"
      >Mi Perfil</a
    >
  </nav>

  <a routerLink="/trabajador/perfil" class="avatar" aria-label="Mi perfil">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path
        d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
      />
    </svg>
  </a>
</header>
