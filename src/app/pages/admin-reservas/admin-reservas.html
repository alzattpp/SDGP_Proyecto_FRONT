<div class="page">
  <app-admin-navbar />

  <main class="main">
    <h1 class="page-title">Reservas</h1>

    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Placa</th>
            <th>Parqueadero</th>
            <th>Hora</th>
            <th>Fecha</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody>
          @for (r of filas; track r.placa + r.fecha) {
            <tr>
              <td>{{ r.nombre }}</td>
              <td>{{ r.placa }}</td>
              <td>{{ r.parqueadero }}</td>
              <td>{{ r.hora }}</td>
              <td>{{ r.fecha }}</td>
              <td>{{ r.total }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </main>
</div>
