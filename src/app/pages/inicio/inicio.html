<div class="contenedor">
  <div class="lado-izq">
    <div class="overlay">
      <img src="/assets/logo.png" alt="SDGP UAM" class="logo" width="280" height="auto" />
    </div>
  </div>

  <div class="lado-der">
    <div class="formulario">
      <h1 class="titulo">Login</h1>

      <div class="campo">
        <label for="correo">Correo</label>
        <input id="correo" type="email" placeholder="Ingresa tu correo" autocomplete="email" />
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input id="password" type="password" placeholder="Ingresa tu contraseña" autocomplete="current-password" />
      </div>

      <a routerLink="/principal" class="btn-login">Iniciar Sesión</a>
      
      <a class="link-password" href="#">¿Olvidaste tu contraseña?</a>
      <p class="registro">
        ¿No tienes cuenta? <a href="#">Regístrate aquí</a>
      </p>
    </div>
  </div>

  <a routerLink="/" class="fab-home" aria-label="Ir al inicio">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8h5z" />
    </svg>
  </a>
</div>
