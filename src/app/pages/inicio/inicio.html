<div class="contenedor">
  <div class="lado-izq">
    <div class="overlay">
      <img src="/assets/logo.png" alt="SDGP UAM" class="logo" width="280" height="auto" />
    </div>
  </div>

  <div class="lado-der">
    <form class="formulario" (ngSubmit)="iniciarSesion()">
      <h1 class="titulo">Login</h1>

      @if (errorMsg(); as err) {
        <p class="mensaje-error" role="alert">{{ err }}</p>
      }

      <div class="campo">
        <label for="correo">Correo</label>
        <input
          id="correo"
          name="correo"
          type="email"
          placeholder="usuario@autonoma.edu.co"
          autocomplete="email"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
        />
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="Ingresa tu contraseña"
          autocomplete="current-password"
          [ngModel]="contrasena()"
          (ngModelChange)="contrasena.set($event)"
        />
      </div>

      <button type="submit" class="btn-login" [disabled]="loading()">
        {{ loading() ? 'Entrando…' : 'Iniciar Sesión' }}
      </button>

      <p class="rol-alt">
        ¿Administrador?
        <a routerLink="/admin/login" class="rol-alt__link">Acceso admin</a>
      </p>
    </form>
  </div>
</div>
