<div class="contenedor">
  <div class="lado-izq">
    <div class="overlay">
      <img src="/assets/logo.png" alt="SDGP UAM" class="logo" width="280" height="auto" />
    </div>
  </div>

  <div class="lado-der">
    <div class="formulario">
      <h1 class="titulo">Login</h1>

      <div class="campo">
        <label for="correo">Correo</label>
        <input id="correo" type="email" placeholder="Ingresa tu correo" autocomplete="email" />
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input id="password" type="password" placeholder="Ingresa tu contraseña" autocomplete="current-password" />
      </div>

      <a routerLink="/principal" class="btn-login">Iniciar Sesión</a>

      <p class="rol-alt">
        ¿Eres trabajador?
        <a routerLink="/trabajador" class="rol-alt__link">Entrar como trabajador</a>
      </p>
      <p class="rol-alt">
        ¿Administrador?
        <a routerLink="/admin/login" class="rol-alt__link">Acceso admin</a>
      </p>
    
  </div>
</div>
