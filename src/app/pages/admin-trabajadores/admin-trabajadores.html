<div class="page">
  <app-admin-navbar [topLabel]="'GESTIÓN DE TRABAJADORES'" />

  <main class="main">
    <div class="head-row">
      <h1 class="page-title">Trabajadores</h1>
      <button type="button" class="btn-anadir" (click)="abrirAgregar()">
        <span class="btn-anadir__icon" aria-hidden="true">+</span>
        Añadir
      </button>
    </div>

    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Documento</th>
            <th>Teléfono</th>
            <th>Parqueadero asignado</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          @for (t of filas(); track t.id) {
            <tr>
              <td>{{ t.nombre }}</td>
              <td>{{ t.documento }}</td>
              <td>{{ t.telefono }}</td>
              <td>{{ t.parqueadero }}</td>
              <td class="cell-actions">
                <button type="button" class="icon-btn icon-btn--edit" (click)="abrirEditar(t)" aria-label="Editar">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path
                      d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1.003 1.003 0 0 0 0-1.42l-2.34-2.34a1.003 1.003 0 0 0-1.42 0l-1.83 1.83 3.75 3.75 1.84-1.82z"
                    />
                  </svg>
                </button>
                <button type="button" class="icon-btn icon-btn--del" (click)="eliminar(t)" aria-label="Eliminar">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24">
                    <path
                      fill="currentColor"
                      d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"
                    />
                  </svg>
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </main>
</div>

@if (modalAgregar) {
  <div class="modal-backdrop" role="presentation" (click)="cerrarAgregar()"></div>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="ta-title" (click)="$event.stopPropagation()">
    <h2 id="ta-title" class="modal-title modal-title--yellow">Agregar trabajador</h2>
    <form class="modal-form" (submit)="$event.preventDefault(); guardarAgregar()">
      <input [(ngModel)]="addNombre" name="an" class="inp-line" type="text" placeholder="Nombre - Apellido" />
      <input [(ngModel)]="addDoc" name="ad" class="inp-line" type="text" placeholder="Cedula" />
      <input [(ngModel)]="addTel" name="at" class="inp-line" type="tel" placeholder="Teléfono" />
      <input
        [(ngModel)]="addParq"
        name="ap"
        class="inp-line"
        type="text"
        placeholder="Parqueadero asignado"
      />
      <button type="submit" class="btn-primary">Añadir</button>
    </form>
  </div>
}

@if (modalEditar) {
  <div class="modal-backdrop" role="presentation" (click)="cerrarEditar()"></div>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="te-title" (click)="$event.stopPropagation()">
    <button type="button" class="modal-close" (click)="cerrarEditar()" aria-label="Cerrar">×</button>
    <h2 id="te-title" class="modal-title modal-title--yellow">Editar Trabajador</h2>
    <form class="modal-form" (submit)="$event.preventDefault(); guardarEditar()">
      <input [(ngModel)]="editNombre" name="en" class="inp-line" type="text" placeholder="Nombre - Apellido" />
      <input [(ngModel)]="editDoc" name="ed" class="inp-line" type="text" placeholder="1050000000" />
      <input [(ngModel)]="editTel" name="et" class="inp-line" type="tel" placeholder="3100000000" />
      <input [(ngModel)]="editParq" name="ep" class="inp-line" type="text" placeholder="Biblioteca" />
      <button type="submit" class="btn-primary">Editar</button>
    </form>
  </div>
}
