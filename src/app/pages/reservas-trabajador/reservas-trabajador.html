<div class="page">
  <app-trabajador-navbar />

  <main class="main">
    <h1 class="page-title">Reservas</h1>

    <div class="search-row">
      <div class="search-wrap">
        <input
          type="search"
          [(ngModel)]="busqueda"
          placeholder="Buscar Placa"
          class="search-input"
          autocomplete="off"
        />
      </div>
    </div>

    <div class="table-border">
      <table class="data-table">
        <thead>
          <tr>
            <th>Placa</th>
            <th>Hora de reserva</th>
            <th>Estado</th>
            <th>Entrada</th>
            <th>Salida</th>
          </tr>
        </thead>
        <tbody>
          @for (r of filtradas(); track r.placa) {
            <tr>
              <td>{{ r.placa }}</td>
              <td>{{ r.horaReserva }}</td>
              <td>{{ r.estado }}</td>
              <td>
                <button type="button" class="btn-entrada" (click)="registrarEntrada(r)">Registrar Entrada</button>
              </td>
              <td>
                <button type="button" class="btn-salida" (click)="registrarSalida(r)">Registrar Salida</button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </main>
</div>
