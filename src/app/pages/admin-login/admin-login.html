<div class="page" aria-labelledby="admin-login-title">
  <div class="bg" aria-hidden="true"></div>
  <div class="overlay" aria-hidden="true"></div>

  <main class="card">
    <p class="admin-login-eyebrow">Portal administrativo</p>
    <img src="/assets/logo.png" alt="SDGP UAM" class="logo" width="200" height="auto" />
    <h1 id="admin-login-title" class="sr-only">Login administrador</h1>

    <form class="form" (ngSubmit)="ingresar()">
      @if (errorMsg(); as err) {
        <p class="form-error" role="alert">{{ err }}</p>
      }

      <div class="field">
        <label for="admin-correo">Correo</label>
        <input
          id="admin-correo"
          name="admin-correo"
          type="email"
          autocomplete="email"
          placeholder="usuario@autonoma.edu.co"
          [ngModel]="correo()"
          (ngModelChange)="correo.set($event)"
        />
      </div>
      <div class="field">
        <label for="admin-pass">Contraseña</label>
        <input
          id="admin-pass"
          name="admin-pass"
          type="password"
          autocomplete="current-password"
          placeholder="Ingresa tu contraseña"
          [ngModel]="contrasena()"
          (ngModelChange)="contrasena.set($event)"
        />
      </div>
      <button type="submit" class="btn-ingresar" [disabled]="loading()">
        {{ loading() ? 'Entrando…' : 'Ingresar' }}
      </button>
    </form>
  </main>

  <a routerLink="/" class="fab-volver" aria-label="Volver al login general" title="Login general">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
    </svg>
  </a>
</div>
