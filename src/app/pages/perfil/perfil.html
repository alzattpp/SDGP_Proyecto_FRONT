<div class="page">
  <header class="navbar">
    <a routerLink="/principal" class="brand" aria-label="Inicio">
      <span class="brand-mark">
        <img src="/assets/logo.png" alt="" width="48" height="48" />
      </span>
    </a>

    <nav class="nav-links" aria-label="Principal">
      <a
        routerLink="/parqueaderos"
        class="nav-item"
        routerLinkActive="nav-item--active"
        [routerLinkActiveOptions]="{ exact: true }"
        >Parqueaderos</a
      >
      <a routerLink="/principal" class="nav-item">Pagos</a>
      <a routerLink="/reservas" class="nav-item">Reservas</a>
      <a
        routerLink="/perfil"
        class="nav-item"
        routerLinkActive="nav-item--active"
        [routerLinkActiveOptions]="{ exact: true }"
        >Mi Perfil</a
      >
    </nav>

    <button type="button" class="avatar" aria-label="Cuenta de usuario">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path
          d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
        />
      </svg>
    </button>
  </header>

  <div class="toolbar">
    <h1 class="greeting">Hola, Usuario</h1>
    <a href="#" class="btn btn--toolbar">Medios de pago</a>
  </div>

  <main class="main-wrap">
    <div class="profile-card">
      <section class="profile-section">
        <div class="section-head">
          <h2 class="section-title">Información</h2>
          <button type="button" class="btn">Editar datos</button>
        </div>
        <dl class="data-list">
          <div class="data-row">
            <dt>Nombre</dt>
            <dd>Usuario</dd>
          </div>
          <div class="data-row">
            <dt>Documento</dt>
            <dd>5555555555</dd>
          </div>
          <div class="data-row">
            <dt>Tipo</dt>
            <dd>Institucional</dd>
          </div>
        </dl>
      </section>

      <hr class="divider" />

      <section class="profile-section">
        <h2 class="section-title">Historial</h2>
        <dl class="data-list">
          <div class="data-row">
            <dt>Número de usos del servicio</dt>
            <dd>2</dd>
          </div>
          <div class="data-row">
            <dt>Último ingreso</dt>
            <dd>12/12/2000</dd>
          </div>
        </dl>
      </section>

      <hr class="divider" />

      <section class="profile-section">
        <div class="section-head section-head--plates">
          <h2 class="section-title">Placas registradas</h2>
          <button type="button" class="btn">Registrar Placa +</button>
        </div>
        <div class="plates">
          <article class="plate-card">
            <span class="plate-id">AAA-000</span>
            <span class="plate-brand">MAZDA</span>
          </article>
          <article class="plate-card">
            <span class="plate-id">ABC-123</span>
            <span class="plate-brand">BMW</span>
          </article>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer"></footer>
</div>
