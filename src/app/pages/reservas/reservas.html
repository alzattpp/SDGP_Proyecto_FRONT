<div class="page">
  <app-usuario-navbar />

  <section class="hero" aria-labelledby="hero-title">
    <div class="hero-bg" aria-hidden="true"></div>
    <div class="hero-overlay"></div>
    <div class="hero-inner">
      <h1 id="hero-title" class="hero-title">Gestiona tu reserva</h1>
    </div>
  </section>

  <main class="content">
    <div class="panels panels--single">
      <section class="panel panel--form">
        <form class="form" aria-label="Nueva reserva" (submit)="$event.preventDefault()">
          <div class="field">
            <label>Parqueadero</label>
            <input type="text" value="Parqueadero Bavaria" readonly />
          </div>

          <div class="field">
            <label for="fecha">Fecha reserva</label>
            <input id="fecha" name="fecha" type="date" />
          </div>

          <div class="field">
            <label for="hora">Hora</label>
            <input id="hora" name="hora" type="time" />
          </div>

          <div class="field">
            <label for="placa">Placa Vehiculo</label>
            <input id="placa" name="placa" type="text" placeholder="Ej. ABC123" autocomplete="off" />
          </div>

          <button type="submit" class="btn-submit">Reservar</button>
        </form>

        <a routerLink="/ver-reservas" class="btn-ver-lista">Ver reservas</a>
      </section>
    </div>
  </main>
</div>
